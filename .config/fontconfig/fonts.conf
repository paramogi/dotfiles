<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Lora</family>
      <family>IosevkaTerm Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>IosevkaTerm Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Iosevka Term Extended</family>
      <family>IosevkaTerm Nerd Font</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>Iosevka Term Extended</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>IosevkaTerm Nerd Font</string>
    </edit>
  </match>
</fontconfig>
